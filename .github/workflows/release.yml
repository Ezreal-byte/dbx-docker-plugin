name: Build Docker plugin candidates

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  candidates:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@f1e0f54a2ba0e755afebd19e490fb31e96200dfa
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci --ignore-scripts && npm test && go -C backend test ./... && go -C backend/sdk test ./... && npm run package
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      go-version: 1.26.x
      plugin-cli-version: 0.1.9
      install-plugin-cli: false
